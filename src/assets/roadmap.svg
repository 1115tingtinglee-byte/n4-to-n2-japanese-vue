<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">N4 到 N2 學習路線</title>
  <desc id="desc">四個階段從 N4 盤點、N3 橋接、N2 訓練到考前整合。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e7f0ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="720" height="520" rx="36" fill="url(#bg)"/>
  <path d="M110 390 C180 250, 260 340, 335 230 S510 140, 610 80" fill="none" stroke="url(#bar)" stroke-width="18" stroke-linecap="round"/>
  <g font-family="Inter, system-ui, sans-serif" font-weight="700" text-anchor="middle">
    <circle cx="115" cy="385" r="48" fill="#fff" stroke="#c4b5fd" stroke-width="6"/>
    <text x="115" y="394" font-size="28" fill="#4c1d95">N4</text>
    <circle cx="280" cy="300" r="48" fill="#fff" stroke="#a5b4fc" stroke-width="6"/>
    <text x="280" y="309" font-size="28" fill="#3730a3">N3</text>
    <circle cx="455" cy="180" r="48" fill="#fff" stroke="#67e8f9" stroke-width="6"/>
    <text x="455" y="189" font-size="28" fill="#155e75">N2</text>
    <circle cx="610" cy="80" r="48" fill="#0f172a"/>
    <text x="610" y="89" font-size="28" fill="#fff">合格</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="18" fill="#334155">
    <text x="80" y="455">基礎盤點</text>
    <text x="230" y="365">文法橋接</text>
    <text x="410" y="250">閱讀聽力</text>
    <text x="535" y="150">錯題整合</text>
  </g>
</svg>
